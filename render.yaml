services:
  - type: redis
    name: vedaai-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: vedaai-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: vedaai-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: vedaai-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        # Update this to your frontend URL later
        value: "https://vedaai-frontend.vercel.app"

  - type: worker
    name: vedaai-worker
    env: python
    buildCommand: "./build.sh"
    startCommand: "celery -A config worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: REDIS_URL
        fromService:
          type: redis
          name: vedaai-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: vedaai-db
          property: connectionString

databases:
  - name: vedaai-db
    databaseName: vedaai
    user: vedaai
    plan: free
